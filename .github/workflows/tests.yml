name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check out the pinned CUPMem source for offline adapter tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: icedreamc/STALE
          ref: ea7d391103a151927cd29d2f01d87597a782bdcb
          path: .cache/cupmem-upstream
          persist-credentials: false
      - name: Install the frozen upstream file manifest
        run: cp evaluation/cupmem/upstream-manifest.json .cache/cupmem-upstream/UPSTREAM_MANIFEST.json
      - name: Run unit tests
        env:
          CUPMEM_UPSTREAM_ROOT: ${{ github.workspace }}/.cache/cupmem-upstream
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest
          paths = sorted(p for p in Path('tests').glob('test_*.py')
                         if not p.name.startswith(('test_reference_', 'test_contextual_'))
                         and p.name != 'test_service.py')
          suite = unittest.TestLoader().loadTestsFromNames(['tests.'+p.stem for p in paths])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Replay the two-clone Git demo
        run: |
          python -m team_memory demo > demo.json
          python -m team_memory demo --followup > followup.json
      - name: Rebuild frozen PEP inputs and replay GPU responses on CPU
        env:
          PYTHONPATH: .
        run: |
          mkdir -p .cache
          git init --bare .cache/peps.git
          git --git-dir=.cache/peps.git fetch --no-tags --depth=2 https://github.com/python/peps.git \
            0a803fec895c5dea8df5153a34b70b1aade7425a \
            9d017fba9be887c8fe7f6737ef543eef8093f781 \
            fad5cd133d734096cda7d8d88d7daaac71fb4fde
          python evaluation/cpython/replay.py .cache/peps.git
          python evaluation/cpython/audit_qa.py > .cache/qa-audit.json
          diff -u results/cpython/qa-audit.json .cache/qa-audit.json
          python evaluation/cpython/qa_controls.py score results/cpython/qa-control-outputs.json > .cache/qa-control-score.json
      - name: Replay the measured QA and proposal across two Git checkouts
        env:
          PYTHONPATH: .
        run: |
          git --git-dir=.cache/peps.git fetch --no-tags --depth=1 https://github.com/python/peps.git 16991a9ce7b223b38f0b473f51a8a7d94c8b9249
          python evaluation/team_pilot/git_replay.py .cache/peps.git > .cache/team-pilot-git.json
      - name: Replay the raw Markdown pull and original owner review
        env:
          PYTHONPATH: .
        run: |
          python evaluation/revision/integration.py evaluation/revision/development .cache/notes-integration.json --recording results/revision/git-integration.json

  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOKENIZERS_PARALLELISM: 'false'
      NLTK_DATA: ${{ github.workspace }}/.cache/reference-nltk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install explicit reference dependencies (no model weights)
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-reference.txt
          python -m nltk.downloader -d "$NLTK_DATA" punkt_tab stopwords
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download('Qwen/Qwen3-8B', revision='b968826d9c46dd6066d109eabc6255188de91218',
              local_dir='.cache/qwen-tokenizer', allow_patterns=['tokenizer*', 'config.json', 'vocab.json', 'merges.txt', 'special_tokens_map.json'])
          PY
      - name: Run reference and public service contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest
          paths = sorted(p for p in Path('tests').glob('test_*.py')
                         if p.name.startswith(('test_reference_', 'test_contextual_'))
                         or p.name == 'test_service.py')
          suite = unittest.TestLoader().loadTestsFromNames(['tests.'+p.stem for p in paths])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful() or bool(result.skipped))
          PY
      - name: Test the deployable package outside the checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          with tarfile.open('.cache/service-package.tar.gz', 'w:gz') as archive:
              for path in sorted(Path('team_memory').rglob('*')):
                  if path.is_file() and (path.suffix in ('.py', '.json', '.md', '.txt') or path.name == 'LICENSE'):
                      archive.add(path, arcname=str(path))
          PY
          python -m evaluation.service_v2_package_check .cache/service-package.tar.gz
